databases:
  - name: zucchini-db
    databaseName: zucchini
    plan: free
    # NOTE: Render's free Postgres is deleted 30 days after creation.
    # Fine for testing; switch plan to "starter" (or higher) before real production use.

services:
  # --- Backend API (Express + Prisma + Socket.io) ---
  - type: web
    name: zucchini-backend
    runtime: node
    plan: free
    rootDir: zucchini-backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: zucchini-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: ACCESS_TOKEN_TTL
        value: 15m
      - key: REFRESH_TOKEN_TTL_DAYS
        value: "30"
      # Set this to the deployed frontend URL after the first deploy
      # (Dashboard -> zucchini-backend -> Environment). e.g. https://zucchini-frontend.onrender.com
      - key: CORS_ORIGIN
        sync: false

  # --- Frontend (React + Vite admin dashboard) ---
  - type: web
    name: zucchini-frontend
    runtime: static
    rootDir: zucchini-frontend
    buildCommand: >-
      VITE_API_URL=https://${BACKEND_HOST}/api
      VITE_SOCKET_URL=https://${BACKEND_HOST}
      npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: BACKEND_HOST
        fromService:
          name: zucchini-backend
          type: web
          property: host
    routes:
      # React Router client-side routing: any deep link (e.g. /orders) must
      # still serve index.html, not 404.
      - type: rewrite
        source: /*
        destination: /index.html
